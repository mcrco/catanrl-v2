# Frozen fixture (tests/test_config.py pins its hashes): do not edit. An eval config's hash
# carries the ppo train defaults, pinned here at the pre-2026-10-19 values (as fx-lineage).
name: fx-mcts
kind: eval
train: {critic_targets: vtrace, critic_gamma: null}
params: {sims: 64}
eval:
  final:
    - {suite: heldout-2p, lineup: ["MCTS:ckpt=fx-lineage/graph-tiny-s42.g1@best:sims=${params.sims}:${params.world}", F]}
sweep:
  axes:
    params.sims: [16, 64]
    world: {oracle: {params.world: "oracle=true"}, d4: {params.world: "dets=4"}}
  name: "s{params.sims}-{world}"

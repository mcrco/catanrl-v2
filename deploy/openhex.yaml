# Our bots on OpenHex (https://open-hex.web.app). A registration is permanent (its
# name, description, Elo and record are fixed to it; OpenHex cannot rename, edit or
# delete one), so each model we deploy is a new registration, a *version*, and this
# file keeps every version ever registered: retired ones stay (retired: true) for the
# record and `catanrl openhex stats`; the runner skips them. Every ckpt is pinned by
# its weights' #sha. API keys: one per registration, in /etc/catanrl/openhex.env.
# Procedure (pin, tag, --check, --describe, register, overlap, retire): see
# deploy/openhex-handoff.md, "Versioning".
bots:
  # v1: the first three registrations (2026-10-17), deployed before versioning; their
  # specs pinned to what @best resolved to when they played.
  - name: catanrl-1v1
    mode: 1v1
    version: 1v1-v1
    spec: BELIEF:ckpt=puffer-graph2/full@e3350#3355b5059503:worlds=16
    key_env: OPENHEX_KEY_1V1
    bot_id: 05c4a25c6c0e46e1
    deployed: 2026-10-17
    tag: openhex-1v1-v2.2
    retired: false
  - name: catanrl-4p
    mode: 4p
    version: 4p-v1
    spec: POLICY:ckpt=ppo-4p/main@e3650#813b2c61338f
    key_env: OPENHEX_KEY_4P
    bot_id: 068460ec188f4a2c
    deployed: 2026-10-17
    tag: openhex-1v1-v2.2
    retired: false
  - name: catanrl-1v1-search
    mode: 1v1
    version: 1v1-search-v1
    # sims=1024 on the OCI VM's CPU (2026-10-20); on yang's GTX 1080 since 2026-10-24 at 2^16
    # sims (~4 s a move; OpenHex allows 60 s), the spec it runs now.
    spec: MCTS:ckpt=puffer-graph2/full@e3350#3355b5059503:sims=65536:dets=1:pending=64:reuse=true:transpositions=true:kernels=fused
    key_env: OPENHEX_KEY_1V1_SEARCH
    bot_id: b8334c08b8d34a19
    deployed: 2026-10-20
    tag: openhex-1v1-v2.1
    retired: true
    retired_at: 2026-11-04  # replaced by catanrl-1v1-search-v2
  # v2 (2026-10-27): ppo-2p-fr3/full@e4350, v1's net (puffer-graph2/full@e3350) continued for
  # ~1.57b steps on OpenHex's 1v1 rules (friendly robber, balanced dice). heldout-2p-fr, 5,000
  # games each: POLICY 98.92 vs F, 64.66 vs v1's net, 51.0 vs ppo-2p-fr/full@e7600; BELIEF
  # 98.94 vs F, 51.18 vs e7600.
  - name: catanrl-1v1-v2
    mode: 1v1
    version: 1v1-v2
    spec: BELIEF:ckpt=ppo-2p-fr3/full@e4350#43eca7ffdd41:worlds=16
    key_env: OPENHEX_KEY_1V1_V2
    bot_id: 9f7c562318324853
    deployed: 2026-10-27
    tag: openhex-1v1-v2.2
    evidence: [cbba2d1098a7be6c, b38e49dc2f3a95b3, 507970d71e8d6566, 7c0d2f67135e7aad, 32d82b766f6b9526]
    retired: false
  # 2^17 sims (Marco), v1's search options, and deadline=45: a move's searches stop at 45 s
  # and play their most-visited move so far (counted as "cut" in games.jsonl's search). On
  # yang's GTX 1080 a fresh 2^17 search takes 7.5-9.9 s (8 positions, 2026-11-04), so the
  # deadline is a safety net. (tools/move_time.py overstates search ~7x: its Catanatron
  # harness path managed ~2k sims/s against ~15k on the bridge's.)
  - name: catanrl-1v1-search-v2
    mode: 1v1
    version: 1v1-search-v2
    spec: MCTS:ckpt=ppo-2p-fr3/full@e4350#43eca7ffdd41:sims=131072:dets=1:pending=64:reuse=true:transpositions=true:kernels=fused:deadline=45
    key_env: OPENHEX_KEY_1V1_SEARCH_V2
    tag: openhex-1v1-v2.2
    evidence: [cbba2d1098a7be6c, 507970d71e8d6566, 7c0d2f67135e7aad]
    retired: false

# Our bots on OpenHex (https://open-hex.web.app). A registration keeps its id, key, rating
# and record for good and cannot be deleted, so each model we deploy is a new
# registration, a *version*, and this file keeps every version ever registered: retired
# ones stay (retired: true) for the record and `catanrl openhex stats`; the runner skips
# them. Its name and description can be edited (PATCH /api/bots/me; a rename once in 24 h):
# the name here must follow a rename, since the runner checks each key's name against it.
# Names are catanrl-<mode>-<greedy|search>-v<N> since 2026-11-16 (greedy: the network's top
# move, no search); games created before a rename keep the name they were played under.
# Every ckpt is pinned by its weights' #sha. API keys: one per registration, in
# ~/.config/catanrl/openhex.env on yang.
# Procedure (pin, tag, --check, --describe, register, overlap, retire): see
# deploy/openhex-handoff.md, "Versioning".
bots:
  # v1: the first three registrations (2026-10-17), deployed before versioning; their
  # specs pinned to what @best resolved to when they played.
  - name: catanrl-1v1-greedy-v1  # catanrl-1v1 until 2026-11-16
    mode: 1v1
    version: 1v1-v1
    spec: BELIEF:ckpt=puffer-graph2/full@e3350#3355b5059503:worlds=16
    key_env: OPENHEX_KEY_1V1
    bot_id: 05c4a25c6c0e46e1
    deployed: 2026-10-17
    tag: openhex-1v1-v3.1
    retired: true
    retired_at: 2026-11-16  # last played 2026-10-27; not to be deployed again (Marco)
  - name: catanrl-4p-greedy-v1  # catanrl-4p until 2026-11-16
    mode: 4p
    version: 4p-v1
    spec: POLICY:ckpt=ppo-4p/main@e3650#813b2c61338f
    key_env: OPENHEX_KEY_4P
    bot_id: 068460ec188f4a2c
    deployed: 2026-10-17
    tag: openhex-1v1-v4
    retired: false
  - name: catanrl-1v1-search-v1  # catanrl-1v1-search until 2026-11-16
    mode: 1v1
    version: 1v1-search-v1
    # sims=1024 on the OCI VM's CPU (2026-10-20); on yang's GTX 1080 since 2026-10-24 at 2^16
    # sims (~4 s a move; OpenHex allows 60 s), the spec it runs now.
    spec: MCTS:ckpt=puffer-graph2/full@e3350#3355b5059503:sims=65536:dets=1:pending=64:reuse=true:transpositions=true:kernels=fused
    key_env: OPENHEX_KEY_1V1_SEARCH
    bot_id: b8334c08b8d34a19
    deployed: 2026-10-20
    tag: openhex-1v1-v2.1
    retired: true
    retired_at: 2026-11-04  # replaced by catanrl-1v1-search-v2
  # v2 (2026-10-27): ppo-2p-fr3/full@e4350, v1's net (puffer-graph2/full@e3350) continued for
  # ~1.57b steps on OpenHex's 1v1 rules (friendly robber, balanced dice). heldout-2p-fr, 5,000
  # games each: POLICY 98.92 vs F, 64.66 vs v1's net, 51.0 vs ppo-2p-fr/full@e7600; BELIEF
  # 98.94 vs F, 51.18 vs e7600.
  - name: catanrl-1v1-greedy-v2  # catanrl-1v1-v2 until 2026-11-16
    mode: 1v1
    version: 1v1-v2
    spec: BELIEF:ckpt=ppo-2p-fr3/full@e4350#43eca7ffdd41:worlds=16
    key_env: OPENHEX_KEY_1V1_V2
    bot_id: 9f7c562318324853
    deployed: 2026-10-27
    tag: openhex-1v1-v2.2
    evidence: [cbba2d1098a7be6c, b38e49dc2f3a95b3, 507970d71e8d6566, 7c0d2f67135e7aad, 32d82b766f6b9526]
    retired: true
    retired_at: 2026-11-04  # off the ladder so catanrl-1v1-search-v2 meets other bots (41 of its first 43 games were this one)
  # 2^17 sims (Marco), v1's search options, and deadline=45: a move's searches stop at 45 s
  # and play their most-visited move so far (counted as "cut" in games.jsonl's search). On
  # yang's GTX 1080 a fresh 2^17 search takes 7.5-9.9 s (8 positions, 2026-11-04), so the
  # deadline is a safety net. (tools/move_time.py overstates search ~7x: its Catanatron
  # harness path managed ~2k sims/s against ~15k on the bridge's.)
  - name: catanrl-1v1-search-v2
    mode: 1v1
    version: 1v1-search-v2
    spec: MCTS:ckpt=ppo-2p-fr3/full@e4350#43eca7ffdd41:sims=131072:dets=1:pending=64:reuse=true:transpositions=true:kernels=fused:deadline=45
    key_env: OPENHEX_KEY_1V1_SEARCH_V2
    bot_id: 730e1fb940fe46ff
    deployed: 2026-11-04
    tag: openhex-1v1-v3
    evidence: [cbba2d1098a7be6c, 507970d71e8d6566, 7c0d2f67135e7aad]
    retired: true
    retired_at: 2026-11-13  # replaced by catanrl-1v1-search-v3 (Marco: enough other bots are live)
  # v3 (2026-11-13): az-2p-kata/main@e300 (2p-graph-s-5), fr3's net after 300 iterations of
  # AlphaZero self-play from fr3 (55,143 games, pruned visit-count targets), in search-v2's
  # search. Measured at 1,024 sims against fr3's fair raw bot, 2,000 heldout-2p-fr games each:
  # 57.70% with this net, 53.85% with fr3's (paired +3.85 pp, p = 0.003). Not measured at 2^17
  # sims or against search-v2 itself. It replaces search-v2 (Marco).
  - name: catanrl-1v1-search-v3
    mode: 1v1
    version: 1v1-search-v3
    spec: MCTS:ckpt=az-2p-kata/main@e300#513d0caac817:sims=131072:dets=1:pending=64:reuse=true:transpositions=true:kernels=fused:deadline=45
    key_env: OPENHEX_KEY_1V1_SEARCH_V3
    bot_id: 1154c5f058024665
    deployed: 2026-11-13
    tag: openhex-1v1-v3
    evidence: [e917f9bb47b8ad4c, 809619df11e87cc8, b7f9c1f46488c4b0]
    retired: true
    retired_at: 2026-11-15  # replaced by catanrl-1v1-search-v3.1 (the same run, 1,500 iterations later)
  # v3.1 (2026-11-15, Marco): az-2p-kata/main+1500@e1800 (2p-graph-s-6), search-v3's net after
  # 1,500 more iterations of the same self-play (329,221 games in all), in the same search.
  # Measured at 1,024 sims against fr3's fair raw bot on the same 2,000 heldout-2p-fr games:
  # 62.95% with this net, 60.30% at e900, 57.70% with search-v3's (e300; paired +5.25 pp,
  # p = 7e-5) and 53.85% with fr3's. Not measured at 2^17 sims or against search-v3 itself.
  - name: catanrl-1v1-search-v3.1
    mode: 1v1
    version: 1v1-search-v3.1
    spec: MCTS:ckpt=az-2p-kata/main+1500@e1800#7c44ec80540a:sims=131072:dets=1:pending=64:reuse=true:transpositions=true:kernels=fused:deadline=45
    key_env: OPENHEX_KEY_1V1_SEARCH_V3_1
    bot_id: e296048b5a1c4a83
    deployed: 2026-11-15
    tag: openhex-1v1-v3.1
    evidence: [ea2574432c1ce3fc, 4411825addefb873, e917f9bb47b8ad4c, 809619df11e87cc8]
    retired: true
    retired_at: 2026-11-21  # replaced by catanrl-1v1-search-v4
  # v4 (2026-11-21, Marco): az-2p-graph-m-uniform/main@e900 (2p-graph-m-2), the first graph-m
  # net (hidden 192, 4 layers; graph-s: 96, 3) and the first with the balanced-dice state as
  # an input: 2p-graph-m-1 (PPO from scratch) after 900 iterations of search training
  # (152,862 games), in search-v3.1's search. Measured at 1,024 sims against fr3's fair raw
  # bot on the same 2,000 heldout-2p-fr games: 67.00% with this net, 62.95% with
  # search-v3.1's (paired +4.05 pp, p = 0.004), 64.65% with 2p-graph-s-8 (p = 0.086), 57.25%
  # with its own start. Not measured at 2^18 sims or against search-v3.1 itself. Before it
  # was registered its budget went from 2^17 to 2^18 sims (Marco, 2026-11-22: one world,
  # search deeper; dets=8 lost to dets=1 at 1,024 sims). Timed on yang's GTX 1080 at batch 1
  # beside the live bots: 2^17 takes 14.5 s a decision (median of 90, slowest 16.5 s), 2^18
  # 27.3 s (median of 40, slowest 30.2 s, 4.8 GB of host RAM), about 9,600 sims a second,
  # none cut by the 45 s deadline; a move of several decisions (a discard, a knight and its
  # robber) shares the 45 s and may be ("cut" in games.jsonl's search).
  - name: catanrl-1v1-search-v4
    mode: 1v1
    version: 1v1-search-v4
    spec: MCTS:ckpt=az-2p-graph-m-uniform/main@e900#73249d10e959:sims=262144:dets=1:pending=64:reuse=true:transpositions=true:kernels=fused:deadline=45
    key_env: OPENHEX_KEY_1V1_SEARCH_V4
    deployed: 2026-11-22
    tag: openhex-1v1-v4
    evidence: [af97f7595f82b53d, ea2574432c1ce3fc, cc4ccbcc8cb418f6, 9c7a904b68e6fb51]
    retired: false

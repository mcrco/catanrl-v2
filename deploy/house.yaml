# The tables catan.marcoya.ng keeps open (catanrl house, on the OCI VM).
# max_games counts the waiting room too: at most max_games - 1 in play.
server: wss://catan.marcoya.ng
server_key: 36da1994b58ca3dc627a0dd495210cf279977c0871f604396e87c5bf1a9c9f2f
think_s: 0.8
tables:
  - name: puffer-graph2
    label: puffer-graph2
    spec: BELIEF:ckpt=puffer-graph2/full@best:worlds=16
    room:
      name: 1v1 vs puffer-graph2
      config: {num_players: 2, vps_to_win: 15, discard_limit: 9, decision_timeout_ms: 120000}
    max_games: 6
  - name: ppo-4p
    label: ppo-4p
    spec: POLICY:ckpt=ppo-4p/main@best
    room:
      name: 4p vs ppo-4p
      config: {num_players: 4, decision_timeout_ms: 120000}
    max_games: 4
  # The generalist ppo-mixed on a fresh random island per room (15-30 land tiles, Table.map).
  # It never trained on blobs: a graph network, it plays each island at dims covering it
  # (ViewAgent rebinds), and on heldout-random-4p it beats the blob-trained ppo-mixed-blob
  # (73.9 [72.5, 75.3] vs 67.4 [65.9, 68.8]).
  - name: blob-4p
    label: ppo-mixed
    spec: "POLICY:ckpt=ppo-mixed/main@best#1183427bf0cf"
    map: {type: blob, land_tiles: [15, 30]}
    room:
      name: 4p island vs ppo-mixed
      config: {num_players: 4, decision_timeout_ms: 120000}
    max_games: 4

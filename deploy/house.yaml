# The tables catan.marcoya.ng keeps open: `catanrl house` on the OCI VM (systemd catanrl-house).
# The OpenHex bots no longer run there. max_games counts the waiting room too: at most
# max_games - 1 in play. The 1v1 table's robber_mode and dice_mode need catanatron da239a6 or
# later on the server, and an engine with balanced dice in the house's checkout.
# Specs are pinned by weights sha: a new @best fails loudly at startup instead of swapping bots.
# Every table seats the strongest raw network (no search) measured for its setting (Marco,
# 2026-11-18). `trades: true` lets the person and the bots trade with each other (room config
# `trades`, catanatron 2026-11-23 or later on the server): the bots answer, confirm and propose
# by their own value head (catanrl.bridge.trading; or a dict of TradeJudge keywords).
# `bots: 1` with `add_bots: true` opens each room with one bot: people join it, and anyone
# seated may ask for more bots until the room is full (the server's add_bot, catanatron
# 2026-11-24 or later).
server: wss://catan.marcoya.ng
server_key: 36da1994b58ca3dc627a0dd495210cf279977c0871f604396e87c5bf1a9c9f2f
think_s: 0.8
tables:
  # OpenHex's 1v1 rules (catanrl's base-2p-fr), which graph-m-2p-lr trained on: 15 points,
  # discard above 9, OpenHex's friendly robber (public points only) and its balanced dice.
  # graph-m is a full-level network, so it plays averaged over 16 sampled hands; as that fair
  # raw bot it beats ppo-2p-fr3's 55.0% [53.6, 56.4] over 5,000 games.
  - name: graph-m-2p
    label: graph-m
    spec: "BELIEF:ckpt=graph-m-2p-lr/main@e22711#673425d606b5:worlds=16"
    room:
      name: 1v1 OpenHex rules vs graph-m
      config: {num_players: 2, vps_to_win: 15, discard_limit: 9, robber_mode: friendly_public,
               dice_mode: balanced, decision_timeout_ms: 120000}
    max_games: 6
  # The generalist gen-base-2 (one seat network for 2-4 players, private level) on the standard
  # board: at 3p it takes 39.6% [37.8, 41.4] from two ppo-mixed (parity 33.3), at 4p 27.85%
  # [26.5, 29.2] from three ppo-4p (parity 25).
  - name: gen-base-3p
    label: gen-base
    spec: "POLICY:ckpt=gen-base-2/main@e3800#ac792590f9f1"
    room:
      name: 3p vs gen-base
      config: {num_players: 3, decision_timeout_ms: 120000}
    max_games: 4
    trades: true
    bots: 1
    add_bots: true
  - name: gen-base-4p
    label: gen-base
    spec: "POLICY:ckpt=gen-base-2/main@e3800#ac792590f9f1"
    room:
      name: 4p vs gen-base
      config: {num_players: 4, decision_timeout_ms: 120000}
    max_games: 4
    trades: true
    bots: 1
    add_bots: true
  # The generalist ppo-mixed on a fresh random island per room (15-30 land tiles, Table.map).
  # It never trained on blobs: a graph network, it plays each island at dims covering it
  # (ViewAgent rebinds), and on heldout-random-4p it beats the blob-trained ppo-mixed-blob
  # (73.9 [72.5, 75.3] vs 67.4 [65.9, 68.8]). gen-base-2 has not been measured on islands.
  - name: blob-4p
    label: ppo-mixed
    spec: "POLICY:ckpt=ppo-mixed/main@best#1183427bf0cf"
    map: {type: blob, land_tiles: [15, 30]}
    room:
      name: 4p island vs ppo-mixed
      config: {num_players: 4, decision_timeout_ms: 120000}
    max_games: 4
    trades: true
    bots: 1
    add_bots: true

# Model names (Marco, 2026-11-08): one short name per network we talk about, so the name always
# says the player count and the network size. Format: <players>-<preset>-<n>
#   players: 2p, 4p, or mix (one net for 2-4 players)
#   preset:  the network preset in configs/models (graph-s 541,540 parameters, graph-m 2,320,100)
#   n:       1, 2, 3 ... in the order registered for that players-preset pair
# `ref` is the pinned checkpoint (run/variant@epoch#weights-sha) that the name stands for; records and
# configs keep using refs, so nothing older changes. `steps` counts every agent step behind the
# weights, parents included. Roles point at a name and move when a better net replaces it.
# Docs only for now: `ckpt=<name>` resolves after graph-m-2p-lr ends (runner code freeze).
roles:
  best-2p: 2p-graph-m-1        # the yardstick every new 1v1 net plays (Marco, 2026-11-10; fr3 before)
  best-4p: 4p-graph-s-1
models:
  2p-graph-s-1:
    ref: "puffer-graph2/full@e3350#3355b5059503"
    rules: base-2p
    from: scratch
    steps: 442_521_600
    use: first deployed 1v1 net (OpenHex 1v1-v1, 1v1-search-v1)
  2p-graph-s-2:
    ref: "ppo-2p-fr/full@e7600#7c7b43b099c0"
    rules: base-2p-fr
    from: 2p-graph-s-1
    steps: 1_446_451_200
    use: 2p-graph-s-1 continued for 1.0B steps on OpenHex's 1v1 rules
  2p-graph-s-3:
    ref: "ppo-2p-fr3/full@e4350#43eca7ffdd41"
    rules: base-2p-fr
    from: 2p-graph-s-2
    steps: 2_021_068_800
    use: fr3; deployed (OpenHex 1v1-v2, the site's 1v1 room); best-2p until 2026-11-10
  2p-graph-s-4:
    ref: "discount-2p/g1-s42@e3786#aa8868d9c6da"
    rules: base-2p-fr
    from: scratch
    steps: 500_115_456
    use: g1; the from-scratch graph-s baseline on OpenHex's 1v1 rules (gamma 1)
  2p-graph-s-5:
    ref: "az-2p-kata/main@e300#513d0caac817"
    rules: base-2p-fr
    from: 2p-graph-s-3
    steps: 2_030_899_200
    use: fr3 after 300 iterations of AlphaZero self-play (9.8M searched moves); in the 1,024-sim search 57.7% vs fr3's raw bot against 53.85% with fr3's net; the net of OpenHex 1v1-search-v3
  2p-graph-s-6:
    ref: "az-2p-kata/main+1500@e1800#7c44ec80540a"
    rules: base-2p-fr
    from: 2p-graph-s-5
    steps: 2_080_051_200
    use: fr3 after 1,800 iterations of AlphaZero self-play (329,221 games, 59M searched moves); in the 1,024-sim search 62.95% vs fr3's raw bot against 57.7% with 2p-graph-s-5 and 53.85% with fr3's net; the net of OpenHex 1v1-search-v3.1
  2p-graph-s-7:
    ref: "az-2p-bundle/main@e900#ad8c2caf507b"
    rules: base-2p-fr
    from: 2p-graph-s-6
    steps: 2_109_542_400
    use: 2p-graph-s-6 after 900 more iterations (160,906 games) with the dice-state input and the outcome head; in the 1,024-sim search 63.7% vs fr3's raw bot against 62.95% with 2p-graph-s-6 (not significant); not deployed
  2p-graph-s-8:
    ref: "az-2p-tricks/main@e900#8f4cb767d188"
    rules: base-2p-fr
    from: 2p-graph-s-7
    steps: 2_139_033_600
    use: 2p-graph-s-7 after 900 more iterations (159,919 games) with six KataGo pieces (search-value blend, surprise weighting, soft policy head, small searches in decided games, forced playouts, root temperature); in the 1,024-sim search 64.65% vs fr3's raw bot against 63.7% with 2p-graph-s-7 (not significant); not deployed
  2p-graph-m-1:
    ref: "graph-m-2p-lr/main@e22711#673425d606b5"
    rules: base-2p-fr
    from: scratch
    steps: 3_000_032_256
    use: graph-m from scratch at half graph-s's learning rate; 56.5% vs 2p-graph-s-3 (fr3) on heldout-2p-fr; best-2p since 2026-11-10
  2p-graph-m-2:
    ref: "az-2p-graph-m-uniform/main@e900#73249d10e959"
    rules: base-2p-fr
    from: 2p-graph-m-1
    steps: 3_029_523_456
    use: 2p-graph-m-1 after 900 iterations (152,862 games) of search training (az-2p-tricks' recipe without the surprise weighting, dice-state input, outcome and soft policy heads); in the 1,024-sim search 67.0% vs fr3's raw bot against 64.65% with 2p-graph-s-8 (p = 0.086) and 57.25% with 2p-graph-m-1; raw policy level with 2p-graph-m-1; OpenHex 1v1-search-v4 (released 2026-11-21)
  4p-graph-s-1:
    ref: "ppo-4p/main@e3650#813b2c61338f"
    rules: base-4p
    from: scratch
    steps: 956_825_600
    use: deployed (OpenHex 4p-v1, the site's 4p room); best-4p
  4p-graph-s-2:
    ref: "aux-hidden-4p/plain@e600#d2c81ca79841"
    rules: base-4p
    from: scratch
    steps: 157_286_400
    use: the calibrated critic that judges trades in the trade harness
  mix-graph-s-1:
    ref: "ppo-mixed/main@e3550#1183427bf0cf"
    rules: base-2p, 3p and base-4p
    from: scratch
    steps: 930_611_200
    use: one net for 2-4 players and any map; deployed (the site's island room)
  mix-graph-seat-s-1:
    ref: "gen-base/main@e3800#ebde6ebd6eea"
    rules: base-2p-fr, base-3p and base-4p, BASE and hexagon boards, dice input
    from: scratch
    steps: 996_147_200
    use: the player-agnostic network (graph-seat-s, 579,844 parameters; preset and config on wt/player-set until merged); level with 4p-graph-s-1 at 4p, 36.2% vs two mix-graph-s-1 at 3p, 36.2% vs fair 2p-graph-m-1 at 2p; the base for the AlphaZero specialists
  mix-graph-seat-s-2:
    ref: "gen-base-2/main@e3800#ac792590f9f1"
    rules: base-2p-fr, base-3p and base-4p, BASE and hexagon boards, dice input
    from: mix-graph-seat-s-1
    steps: 1_992_294_400
    use: mix-graph-seat-s-1 trained for as many steps again at its floor learning rate; 27.85% vs three 4p-graph-s-1 at 4p, 39.6% vs two mix-graph-s-1 at 3p, 38.4% vs fair 2p-graph-m-1 at 2p; the base for the AlphaZero specialists

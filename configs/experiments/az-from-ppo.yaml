# AlphaZero warm-started from PPO (Marco's "plug the PufferLib GNN into the
# NN-MCTS loop"): graph-s trains by self-play PPO on 2p BASE, then its best
# checkpoint (actor and critic) seeds AlphaZero, whose search uses the same
# network for priors and per-seat values.
#
# The az stage keeps AlphaZero's default evals (config.alphazero_evals, DESIGN
# 6.2): head to head against the PPO network it starts from, ${init}. Select:
# POLICY ${self} vs POLICY ${init} on select-2p at every checkpoint. Final, on
# heldout-2p: best's POLICY, best's MCTS and the start's MCTS (both at the
# training search, dets=1) against POLICY ${init}, and best's POLICY vs F.
name: az-from-ppo
seed: 42
env: {scenarios: [{game: base-2p}], num_envs: 1024}
obs: {level: private}
model: {preset: graph-s}
train:
  algo: ppo
  total_timesteps: 50_000_000
  learning_rate: 2.0e-4
  lr_schedule: kl_adaptive
  kl_target: 0.01
  lr_min: 1.0e-5
  lr_max: 3.0e-4
  gamma: 1.0
  update_epochs: 2
  ent_coef: 0.003
  minibatch_size: 8192
  max_minibatch_size: 2048
  checkpoint_interval: 50
stages:
  ppo:
    eval:
      select: {suite: select-2p, lineup: ["POLICY:ckpt=${self}", F], every: 50}
      final:
        - {suite: heldout-2p, lineup: ["POLICY:ckpt=${run}@best", F]}
  az:
    init_from: {ckpt: "${stages.ppo}@best", parts: [actor, critic]}
    env.num_envs: 512
    train!:
      algo: alphazero
      iterations: 300
      steps_per_iteration: 32
      sims: 64
      fast_sims: 16
      full_search_prob: 0.25
      learning_rate: 5.0e-5
      checkpoint_interval: 10
runtime: {device: cuda, threads: 12, compile: true, time_limit_hours: 8}

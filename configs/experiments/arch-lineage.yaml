# v1's lineage launch script, swept over architectures (DESIGN 6.2), minus its
# DAgger warm start: self-play PPO from scratch, then gamma = 1 from the PPO
# run's epoch 3000 (of about 3050 at 1024 games x 2 rows x 64 steps = 131,072
# agent steps per epoch). Self-play PPO no longer needs a warm start:
# puffer-graph2 reaches 95.2% vs F on heldout-2p from scratch, as v1's graph2
# did. DAgger from F is still a stage away (train.algo: imitation, init_from).
name: arch-lineage
seed: 42
env: {scenarios: [{game: base-2p}], num_envs: 1024}
obs: {level: full, critic_level: full}
model: {preset: graph-s}
# critic_targets / critic_gamma pinned to v1's (V-trace targets at the policy's discount, the pre-2026-10-19
# default): a port of v1's lineage, whose g1 stage moves the critic's discount with the policy's
train: {algo: ppo, total_timesteps: 400_000_000, learning_rate: 3.0e-4, gamma: 0.99, checkpoint_interval: 50, critic_targets: vtrace, critic_gamma: null}
eval:
  select: {suite: select-2p, lineup: ["POLICY:ckpt=${self}", F], every: 50, metric: score_rate}
  final:
    - {suite: heldout-2p, lineup: ["POLICY:ckpt=${run}@best", F]}
    - {suite: heldout-2p, lineup: ["BELIEF:ckpt=${run}@best:worlds=16", F]}
stages:                        # one variant each, run in order per sweep cell
  ppo: {}
  g1: {init_from: {ckpt: "${stages.ppo}@3000"}, train.gamma: 1.0, train.total_timesteps: 200_000_000}
sweep:
  axes:
    model.preset: [graph-s, graph-m, mlp]
    seed: [42, 43]
  name: "{model.preset}-s{seed}"   # graph-m-s43.g1: 3 presets x 2 seeds x 2 stages = 12 variants
meta: {notes: "replaces launch-xdim-warm-lineage-20261009.sh, without its DAgger stage", wandb: {project: catanrl-v2}}
runtime: {device: cuda, threads: 16, time_limit_hours: 12}

# longer rollout segments and lambda 1 (marco, 2026-11-05: "can we try one with 256 steps and lambda 1?").
#
# every run so far cuts each env's rollout into 64-step segments (bptt_horizon 64) and uses gae lambda
# 0.95. a 1v1 game is ~209 decisions (both seats, 88 turns), so a segment holds about a third of a
# game; at the cut the targets bootstrap from the critic, and lambda 0.95 weighs a step k decisions
# ahead by 0.95^k (0.36 at 20, 0.04 at 64), so a step's target is mostly the critic's estimate ~20
# decisions on. with 256-step segments and lambda 1, a step's target is the game's actual result
# whenever the game ends inside the segment (~59% of steps, against ~16% at 64 steps with lambda 1)
# and the critic's value at the cut otherwise. the critic's lambda targets use the same lambda.
# the graph nets have no memory, so the segment length changes only the targets, not what the
# network sees.
#
# design: discount-2p's g1-s42 cell (puffer-graph2's recipe from scratch on base-2p-fr, graph-s, obs
# level full, gamma 1, seed 42, 500M agent steps on one cosine from 0.005 to 0.0005) with three
# changes: bptt_horizon 256, gae_lambda 1.0, and num_envs 258 (from 1032) so the batch stays 132,096
# agent steps (516 rows x 256) with the same 16 optimizer steps per epoch and the same buffer memory.
# fewer games run in parallel (258 against 1032); the env steps per epoch are the same. both knobs
# change together (one run, as asked), so a difference can't be pinned on either alone.
#
# monitors every 50 epochs on select-2p-fr (1,000 games each): vs F and vs ppo-2p-fr3/full@e4350,
# the same games as g1-s42's monitors, so every epoch pairs with g1 by game id (McNemar). finals on
# heldout-2p-fr, 5,000 games each, on @latest: vs F, vs fr3, and head to head vs g1-s42@e3786 (the
# baseline's last checkpoint; +-1.4 pp at 50%).
#
# cost: g1 took ~7.9 h at ~17.7k agent steps/s; 4x more, 4x smaller rollout steps may slow
# collection (unmeasured until a gpu smoke). needs the 8 gb card alone (~4.5 GB; graph-m-2p-lr holds
# 6.5 GB until ~2026-11-10).
#
# launch (main, no other run live):
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True catanrl run configs/experiments/horizon-2p.yaml
name: horizon-2p
seed: 42
env:
  scenarios: [{game: base-2p-fr, turn_limit: 1000, maps: 4096}]
  num_envs: 258                 # 516 rows x 256 steps = 132,096, g1's batch (header)
model: {preset: graph-s, args: {shared: true}}
obs: {level: full}
train:
  algo: ppo
  total_timesteps: 500_000_000  # g1's: 3,785 epochs x 132,096 agent steps (both seats' rows)
  optimizer: muon               # heavyball ForeachMuon(heavyball_momentum=True), as puffer-graph2
  learning_rate: 0.005          # puffer-graph2's peak, cosine to 0.0005
  lr_schedule: constant         # catanrl's KL schedule off; the cosine is PuffeRL's anneal_lr
  anneal_lr: true
  min_lr_ratio: 0.1
  adam_beta1: 0.95              # Muon's momentum
  adam_beta2: 0.999             # not read by Muon
  adam_eps: 1.0e-12             # not read by Muon
  gamma: 1.0
  gae_lambda: 1.0               # g1: 0.95 (header)
  update_epochs: 2
  clip_coef: 0.2
  vf_coef: 2.0
  vf_clip_coef: 0.2             # not read (per-seat value loss)
  ent_coef: 0.005
  max_grad_norm: 2.0
  bptt_horizon: 256             # g1: 64 (header)
  minibatch_size: 16384
  max_minibatch_size: 4096      # as g1
  prio_alpha: 0.8
  prio_beta0: 0.2
  vtrace_rho_clip: 1.0
  vtrace_c_clip: 1.0
  critic_targets: lambda
  critic_gamma: 1.0
  precision: float32
  amp: false
  checkpoint_interval: 50
eval:
  champion: "ppo-2p-fr3/full@e4350#43eca7ffdd41"   # the fixed reference (header)
  select: {from: champion}
  monitor:
    - {name: champion, suite: select-2p-fr, lineup: ["POLICY:ckpt=${self}", "POLICY:ckpt=${champion}"], every: 50,
       metric: score_rate}
    - {name: f, suite: select-2p-fr, lineup: ["POLICY:ckpt=${self}", F], every: 50, metric: score_rate}
  final:
    - {suite: heldout-2p-fr, lineup: ["POLICY:ckpt=${run}@latest", F]}
    - {suite: heldout-2p-fr, lineup: ["POLICY:ckpt=${run}@latest", "POLICY:ckpt=${champion}"]}
    - {suite: heldout-2p-fr, lineup: ["POLICY:ckpt=${run}@latest", "POLICY:ckpt=discount-2p/g1-s42@e3786#aa8868d9c6da"]}
meta:
  wandb: {project: catanrl-v2, entity: myang2-california-institute-of-technology-caltech}
runtime: {device: cuda, threads: 12, num_envs: 512, compile: true}

# AlphaZero / expert iteration (catanrl.train.alphazero): self-play with
# batched SearchPool searches, a replay buffer and Adam(W) on policy
# cross-entropy plus per-seat value BCE. Exactly catanrl's ALPHAZERO_KEYS
# (and the optional reuse, forced_playouts and root_policy_temperature, below).
# Evals: a variant that starts from a network (init_from) is evaluated head to
# head against it, ${init}, unless it sets its own (catanrl.config.alphazero_evals).
algo: alphazero
iterations: 100                # self-play + learning cycles (an epoch each; checkpoints count them)
steps_per_iteration: 32        # VecEnv steps of self-play per iteration (one search per env per step)
root: gumbel                   # puct | gumbel (Gumbel-Top-k + sequential halving: better at low budgets)
sims: 64                       # simulations of a full search (a policy target)
fast_sims: 16                  # simulations of the other moves (value targets only; no Dirichlet noise)
pending: 1                     # leaves a full search sends to the network per round (virtual visits while they
fast_pending: 1                # wait), and a fast search; 1: one leaf a round, sims + 1 rounds per step
full_search_prob: 0.25         # playout cap randomization (KataGo); 1.0 searches every move fully
record_fast: true              # false: only the fully searched moves enter replay (KataGo), the others are just played
dets: 0                        # 0: search the true game (fast); K: K worlds from the seat's hand tracker (fair)
c_puct: 0.75                   # engine units (v1's 1.5)
gumbel_m: 16                   # actions a Gumbel root considers
dirichlet_noise: true          # PUCT roots only (Gumbel roots add Gumbel noise)
temperature_start: 1.0         # move sampling temperature at a game's first decision ...
temperature_end: 0.0           # ... decaying linearly to this ...
temperature_moves: 30          # ... over this many decisions of the game
truncation_value: share        # a truncated game's value target: share (1/n per seat, the eval convention) | zero
policy_target: engine          # engine: the search's own target | gumbel: Gumbel's improved policy rebuilt from the
                               # same search (Gumbel roots) with the sigma below; the search keeps the engine's sigma
                               # | pruned: a PUCT root's visits without those its Dirichlet noise forced (an action
                               # keeps what its value earns under the network's own prior; dets 0 or 1)
target_c_visit: 50.0           # gumbel's sigma = (c_visit + the most visits of an action) * c_scale * completed Q,
target_c_scale: 0.1            # at the engine's constants (50, 0.1, true) the engine's own target
target_rescale: true           # completed Q min-max rescaled over the legal actions (false: clamped to [0, 1])
target_prior_temperature: 1.0  # gumbel's prior term: softmax(logits / T) (the search's own priors are untempered)
replay_capacity: 200_000       # positions; ~5.8 KB each on 2p BASE graph-s rows (float16), saved in the trainer state
min_replay: 5_000              # positions before learning starts
updates_per_iteration: 64      # gradient steps per iteration
minibatch_size: 512
learning_rate: 1.0e-4
weight_decay: 1.0e-4           # AdamW (decoupled L2)
value_coef: 1.0
max_grad_norm: 1.0
search_rows: 512               # leaf rows per network call (CUDA graphs at powers of two up to this)
kernels: torch                 # torch | fused | fused16 (fused with half-precision GEMMs): self-play's forwards on the fused CUDA kernels (shared-trunk graph,
                               # hidden 96, nvcc on PATH), rebuilt from the weights after every learning step
checkpoint_interval: 10        # iterations
# reuse: true                  # optional (root: puct, dets: 0): a game keeps its search tree between decisions; a
                               # search re-rooted at the action played counts the visits it carries towards its
                               # budget (sims or fast_sims as a cap on the root's visits), full ones with new noise
# value_search_blend: 0.5      # optional (2-player games): the value target of a fully searched position is
                               # (1 - w) x the game result + w x the search's value at its root (the root's action
                               # values averaged by the visits the policy target keeps); unset 0: the game result
# value_blend_iterations: 200  # optional: w ramps linearly from 0 to value_search_blend over this many iterations
                               # of the run (unset 0: full weight at once)
# surprise_weight: 0.5         # optional, in [0, 1): this share of the replay's sampling goes by policy surprise
                               # (KL(policy target || the network's root prior) of the position's search), the rest
                               # uniformly; no importance correction. Unset 0: uniform
# surprise_cap: 10.0           # optional (> 1): a position's surprise counts up to this many times the buffer's
                               # mean (unset 0: no cap)
# soft_policy_coef: 4.0        # optional, with model.args.soft_policy: x the cross-entropy of the soft policy head
                               # (a second policy head, training only) to the policy target ** (1 / T) over the
                               # legal actions
# soft_policy_temperature: 4.0 # optional: the T above (unset 4)
# decided_value: 0.9           # optional (2-player games), in (0.5, 1): a game is decided once its last
                               # decided_lookback searches all gave one seat at least this value ...
# decided_lookback: 3          # ... (at least 1 with decided_value)
# decided_full_search_prob: 0.05  # optional: full_search_prob in decided games (unset 0: no full searches there)
# decided_fast_sims: 8         # optional: fast_sims in decided games (unset 0: fast_sims; another budget needs reuse)
# forced_playouts: 2.0         # optional (root: puct; KataGo's k): a full search visits a root action that has a
                               # visit but fewer than sqrt(k * its prior * the root's visits) before PUCT is asked;
                               # policy_target: pruned takes those visits out of the target again. Unset (0): PUCT alone
# root_policy_temperature: 1.25  # optional (root: puct): a full search's root priors raised to 1 / this and
                               # renormalized, before the Dirichlet noise is mixed in. Unset (1): the network's priors

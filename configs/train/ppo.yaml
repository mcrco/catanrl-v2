# PPO through PuffeRL (catanrl.train.puffer), written deliberately rather than
# copied from PufferLib's default.ini: Adam, constant LR, amp and bf16 off
# (Turing GPUs have no bf16), no prioritized replay. These are exactly the
# PuffeRL keys minus the runner's (device, seed, data_dir, compile,
# batch_size, ...: set from `runtime` and the env) plus catanrl's
# (algo, lr_schedule, kl_target, lr_min, lr_max, log_interval, muon_exclude,
# muon_exclude_lr, aux_coef, freeze).
algo: ppo
total_timesteps: 400_000_000   # agent steps: rows (num_envs x max_players) per VecEnv step
learning_rate: 3.0e-4
lr_schedule: constant          # constant | kl_adaptive (needs kl_target, lr_min, lr_max)
kl_target: null
lr_min: null
lr_max: null
anneal_lr: false
min_lr_ratio: 0.0
optimizer: adam                # muon compiles through heavyball even with compile off
adam_beta1: 0.9
adam_beta2: 0.999
adam_eps: 1.0e-8
gamma: 0.99
gae_lambda: 0.95
update_epochs: 1
clip_coef: 0.2
vf_coef: 0.5
vf_clip_coef: 0.2
max_grad_norm: 0.5
ent_coef: 0.01
bptt_horizon: 64
minibatch_size: 2048
max_minibatch_size: 2048
precision: float32
amp: false                     # PuffeRL reads config.get('amp', True)
prio_alpha: 0.0                # uniform minibatches
prio_beta0: 1.0
vtrace_rho_clip: 1.0
vtrace_c_clip: 1.0
critic_targets: lambda         # lambda (plain GAE lambda-returns, every ratio 1) | vtrace (the policy's V-trace returns,
                               # whose one-sided ratios push the per-seat sum above the truth; it takes critic_gamma: null,
                               # so pin both or the config is refused). lambda is the default since 2026-10-19, after
                               # ppo-4p-critic-fix; experiment YAMLs with stored runs pin vtrace / null so their hashes
                               # still match, the others take the new default.
critic_gamma: 1.0              # lambda only: the critic's discount (1.0: undiscounted per-seat win probabilities, summing
                               # to the share of games somebody wins; null: the policy's gamma). 1.0 is the default since
                               # 2026-10-19 (ppo-4p-critic-fix/lambda-critic-g1: calibrated in 20 epochs, policy unchanged);
                               # experiment YAMLs with stored runs pin null so their hashes still match.
muon_exclude: []               # parameter-name patterns (fnmatch, e.g. value_head.mlp.4.weight) stepped by AdamW, not Muon
muon_exclude_lr: null          # AdamW's learning rate for them while the main one is at learning_rate (it follows the schedule)
aux_coef: 0.0                  # weight of the aux hidden-information loss (model.args.aux on a shared graph trunk, trained
                               # on the critic block: obs.critic_level above obs.level); 0 = off, the plain PPO
freeze: []                     # network parts (actor, critic, aux: model.parts) left as they are: no gradient, not in the
                               # optimizer. [actor] refits the critic under a fixed policy (rollouts still sample it; the
                               # policy and entropy terms reach no trained parameter): on a shared trunk only the value
                               # head trains, so split one first (init_from.split_shared) to refit a whole critic network
checkpoint_interval: 50        # epochs
log_interval: 32               # VecEnv steps between episode-stat pops
